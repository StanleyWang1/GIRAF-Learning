[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giraf-learning"
version = "0.1.0"
description = "Teleoperation, demonstration collection, and learning for the GIRAF robot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==15.1.0",
    "diffusers>=0.37,<0.38",
    "numcodecs==0.15.1",
    "numpy==2.5.2",
    "opencv-python==4.14.0.94",
    "pyyaml==6.0.2",
    "sympy==1.14.0",
    "torch>=2.7,<3",
    "zarr==2.18.7",
]

[project.optional-dependencies]
hardware = [
    "depthai==3.9.0",
    "dynamixel-sdk==4.0.5",
    "evdev==2.0.0",
    "natnet==0.2.0",
    "pycandlemab==1.6.2",
]

[project.scripts]
giraf-prune = "giraf.data.prune:main"
giraf-replay = "giraf.replay_cli:main"
giraf-teleop = "giraf.teleop:main"
# TODO: giraf-train once a training script (data loader, wandb, checkpoints) exists.

[tool.hatch.build.targets.wheel]
packages = ["src/giraf"]

# TODO: CPU-only torch keeps setup small; switch to a CUDA index for real training.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
