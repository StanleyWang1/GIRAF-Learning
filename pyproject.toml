[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giraf-learning"
version = "0.1.0"
description = "Teleoperation, demonstration collection, and learning for the GIRAF robot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==15.1.0",
    "diffusers>=0.37,<0.38",
    "numcodecs==0.15.1",
    "numpy==2.5.2",
    "opencv-python==4.14.0.94",
    "pyyaml==6.0.2",
    "sympy==1.14.0",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "zarr==2.18.7",
]

[project.optional-dependencies]
train = ["wandb>=0.19"]
hardware = [
    "depthai==3.9.0",
    "dynamixel-sdk==4.0.5",
    "evdev==2.0.0",
    "natnet==0.2.0",
    "pycandlemab==1.6.2",
]

[project.scripts]
giraf-clean = "giraf.clean:main"
giraf-diagnose = "giraf.diagnostics:main"
giraf-prune = "giraf.data.prune:main"
giraf-replay = "giraf.replay_cli:main"
giraf-teleop = "giraf.teleop:main"
giraf-train = "giraf.learning.train_cli:main"
giraf-view = "giraf.viewer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/giraf"]

# CUDA 13.0 wheels for the RTX 5070 Ti (sm_120). macOS falls back to PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
